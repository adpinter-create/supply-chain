name: Refresh supply chain tools

# Daily 11:37 UTC (~6:37 AM Central). Each tool's refresh step is a no-op when nothing is due.
#   capacity/   plan horizon rolls to the current month
#   scheduler/  static for now (engine not yet in this repo)
#   supply-planner/  plan rolls to the current month
on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: supply-chain-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capacity model - roll plan horizon
        if: github.event_name != 'push'
        run: python scripts/roll_capacity.py

      - name: Supply planner - roll plan to the current month
        if: github.event_name != 'push'
        run: python scripts/roll_supply.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A capacity scheduler supply-planner
          git diff --cached --quiet || (git commit -m "Refresh $(date -u +%F)" && git push)

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          for d in capacity scheduler supply-planner; do [ -d "$d" ] && cp -r "$d" _site/ || true; done
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
